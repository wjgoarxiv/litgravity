<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/stage-kit.js"></script>
<script src="/lit/clips.js"></script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  // One keyed clip cued at 1.0 s and played once, then held until 1.5 s: its frame is a function of t alone.
  const show = LitStage.clip({ parent: document.getElementById("stage"), id: "swatch", box: { x: 600, y: 300, w: 400, h: 300 } });
  LitStage.define({ width: 1920, height: 1080, fps: 60, duration: 10, render(t) { show(t, { start: 1.0, hold: t < 1.5 }); } });
</script>
</body>
</html>
