<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/stage-kit.js"></script>
<script src="/lit/clips.js"></script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage { position: absolute; inset: 0; }
  #copy { position: absolute; left: 150px; top: 860px; margin: 0; z-index: 2; font: 700 64px Pretendard; color: #f2f4f7; }
</style>
</head>
<body>
<div id="stage"></div>
<p id="copy"></p>
<script>
  const copy = document.getElementById("copy");
  copy.textContent = "Lanterns drift home";
  LitStage.text(copy);
  // A declared clip stretched over the whole frame that flips between white and black on every frame.
  const show = LitStage.clip({ parent: document.getElementById("stage"), id: "strobe", box: { x: 0, y: 0, w: 1920, h: 1080 } });
  LitStage.define({ width: 1920, height: 1080, fps: 60, duration: 10, render(t) { show(t, { start: 0, loop: true }); } });
</script>
</body>
</html>
