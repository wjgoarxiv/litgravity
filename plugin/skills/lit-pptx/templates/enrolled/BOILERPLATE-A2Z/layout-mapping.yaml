# Minimal, clean decoration: a single ink hairline under the title band on body
# slides (matches CSS .header-line). Cover/closing stay whitespace-clean.
decorations:
  cover:
    elements: []
  cover_rule:
    elements:
      - type: line
        x: 0.73
        y: 1.95
        w: 2.2
        color: "#3C3836"
        width: 4
        note: "hairline rule standing in for the cover furniture"

  cover_band:
    elements:
      - type: rect
        x: 0.0
        y: 0.0
        w: 10.0
        h: 2.6
        fill: "#FBFAF7"
        note: "warm near-white band above the title"
      - type: line
        x: 0.73
        y: 2.6
        w: 8.54
        color: "#CBC2B5"
        width: 1

  body:
    elements:
      - type: line
        x: 0.270
        y: 1.020
        w: 9.460
        color: "#3C3836"
        width: 1.5
        note: "Title underline hairline (boilerplate .header-line)"
  closing:
    elements: []
