# Layout Mapping — BOILERPLATE-PRETENDARD
# 4:3 canvas, 10 x 7.5 in. Geometry derived from templates/boilerplate_professional.css
# (960x720px @ 96dpi -> 10x7.5in). Positions in inches.
# No base PPTX master: slides are built from scratch, so layout_source is "none".

