# Signal: a talk where every slide is one idea said loudly. Very large type, few words, a white
# ground and one hot red-orange accent kept for the protagonist. Wrong when the audience has to
# read the details later, or when most of the content is tables.
id: signal
name: Signal
version: "1.0.0"
intent: "Live pitches and launches: one idea per slide at large size."
canvas: ["16:9", "4:3"]

# Pretendard by default; the A2Z map below applies only when the source asks (faces: a2z).
faces:
  display: Pretendard Bold
  title: Pretendard Bold
  body: Pretendard Regular
  label: Pretendard Regular
  numeral: Pretendard Bold
faces-a2z:
  display: A2Z Black
  title: A2Z Bold
  body: Pretendard Regular
  label: Pretendard Regular
  numeral: A2Z Black

palette:
  ground: "#FFFFFF"
  surface: "#F4F4F5"
  ink: "#15131A"
  ink-muted: "#55525C"
  line: "#D4D4D8"
  accent: "#C8361A"
  accent-deep: "#6E1A0C"
  accent-tint: "#FBE7E2"
  field: "#C8361A"
  on-field: "#FFFFFF"
  positive: "#1E7A3F"
  # The accent is red, so a loss keeps the ink colour and carries its ▼ sign instead.
  negative: "#15131A"
  series: ["#C8361A", "#15131A", "#6B6870", "#2F6F8F"]

ramp: reading
hero: false
type-voice:
  title-tracking: -1
  display-tracking: -2

density: 10
variance: 6
radius: 0
edge: fill

treatments: [statement, top-plain-large, bottom-anchor, top-rule]
role-defaults:
  content: top-plain-large
  data: top-rule
  data-takeaway: top-plain-large
  sequence: top-rule
  image: bottom-anchor
  statement: statement
  reference: top-rule
  definition: top-rule

decoration: [colour-field, hairline-rule, numeral]
layout-families: [statement, big-number, image-split, asymmetric-feature, process, kpi-row, chart-insight, full-chart, comparison, table-insight, quote]
# Display slides: the device a type-led cover, a statement, a big number and a closing's next step
# are drawn with (see references/layout-families.md, "Display slides").
display:
  cover: drench
  statement: open
  number: field
  closing: band
covers: [cover-numeral, cover-typographic, cover-split-field]
sections: [section-field, section-numeral]
closings: [closing-statement, closing-ask]

table:
  header: none
  header-ink: ink
  rules: top-bottom
  banding: none
  totals: bold
  protagonist: accent-tint
chart:
  gridlines: none
  labels: direct
  highlight: accent-on-muted
image:
  frame: none

fill-order: [step-up, change-family, anchor-visual, distribute]
avoid:
  - red for losses (losses carry ▼ in ink)
  - more than two lines of display text
  - cards
  - bullet lists longer than four items
