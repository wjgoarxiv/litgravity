<!doctype html><html><head><meta charset="utf-8"><!-- A shipped NEGATIVE that must keep failing the cover gate on G2 and G3: a still picture with a faint
     breathing glow, which the encoder drops. Never a recipe. -->
<link rel="stylesheet" href="/lit/fonts.css">
<style>
html, body { margin: 0; width: 1200px; height: 600px; overflow: hidden; background: #080d14; color: #f2efdf; font-family: "JetBrains Mono"; }
.c { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
body.mask, body.mask * { background: #000 !important; color: #000 !important; border-color: #000 !important; }
body.mask .title { color: #fff !important; }
</style><script src="/lit/loop-kit.js"></script></head>
<body>
<div class="c" id="glow" style="top:0;height:600px;background:radial-gradient(ellipse at 50% 45%, #ff633722, transparent 60%)"></div>
<div class="c title" style="top:210px;font-size:110px;font-weight:800;letter-spacing:6px">LITGRAVITY</div>
<div class="c" style="top:360px;font-size:28px;font-weight:500">KEEP THE WORK <span style="color:#ff6337">LIT.</span></div>
<script>
// Near-static cover: a still with a faint breathing glow (what "relight a still" becomes without a strong base).
window.renderFrame = (t, o = {}) => { document.body.className = o.mask ? "mask" : ""; document.getElementById("glow").style.opacity = 0.75 + 0.25 * Math.sin(LitLoop.TAU * t); };
document.fonts.ready.then(() => { window.ready = true; });
</script></body></html>
