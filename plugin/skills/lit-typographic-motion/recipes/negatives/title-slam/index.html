<!doctype html><html><head><meta charset="utf-8"><!-- A shipped NEGATIVE that must keep failing the cover gate on G2 and G3: the old type path's habit of a
     title slam, line-by-line text with holds and a crossfade to a settled end card. Never a recipe. -->
<link rel="stylesheet" href="/lit/fonts.css">
<style>
html, body { margin: 0; width: 1200px; height: 600px; overflow: hidden; background: #080d14; color: #f2efdf; font-family: "JetBrains Mono"; }
.c { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
body.mask, body.mask * { background: #000 !important; color: #000 !important; border-color: #000 !important; }
body.mask .title { color: #fff !important; }
</style><script src="/lit/loop-kit.js"></script></head>
<body>
<div class="c title" id="title" style="top:150px;font-size:110px;font-weight:800;letter-spacing:6px">LITGRAVITY</div>
<div class="c" id="l1" style="top:330px;font-size:34px;font-weight:500">Plans before code.</div>
<div class="c" id="l2" style="top:380px;font-size:34px;font-weight:500">Loops until green.</div>
<div class="c" id="l3" style="top:430px;font-size:34px;font-weight:500;color:#ff6337">Evidence, not claims.</div>
<div class="c" id="end" style="top:250px;font-size:64px;font-weight:700;opacity:0">KEEP THE WORK <span style="color:#ff6337">LIT.</span></div>
<script>
// Imitates the old type path: title slam, line-by-line karaoke with holds, crossfade to a settled end card.
const { clamp, ease } = LitLoop, S = 10;
const ramp = (s, a, d) => ease.outCubic(clamp((s - a) / d));
window.renderFrame = (t, o = {}) => {
  document.body.className = o.mask ? "mask" : "";
  const s = t * S;
  const out = 1 - ramp(s, 5.6, 0.4);
  const ti = document.getElementById("title");
  ti.style.opacity = ramp(s, 0.2, 0.5) * out; ti.style.transform = `scale(${1.25 - 0.25 * ramp(s, 0.2, 0.5)})`;
  [2.0, 3.0, 4.0].forEach((a, i) => { const el = document.getElementById("l" + (i + 1)); el.style.opacity = ramp(s, a, 0.3) * out; el.style.transform = `translateY(${12 * (1 - ramp(s, a, 0.3))}px)`; });
  document.getElementById("end").style.opacity = ramp(s, 6.1, 0.5) * (1 - ramp(s, 9.6, 0.4));
};
document.fonts.ready.then(() => { window.ready = true; });
</script></body></html>
