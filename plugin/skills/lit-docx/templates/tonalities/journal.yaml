# Journal: long-form reading in two columns (essays, newsletters, white papers, research summaries not bound
# for a named journal), close to a publisher profile: a title block with authors, abstract and keywords,
# decimal section numbers for cross-references, Latin body text in Times New Roman (Hangul and headings in
# Pretendard), ragged right, the short title and folio in the header.
schema_version: 2
tonality: Journal
summary: Long-form reading in two columns, for essays, newsletters, white papers and research summaries
dials: {density: 9, variance: 6}
docx:
  page: {size: A4}
  font: {latin: Times New Roman, hangul: Pretendard, heading: Pretendard, body_pt_ko: 10.5, body_pt_en: 10.5}
design:
  ramp: {h1: 1.3, h2: 1.15, title: 2.5}
  numbering: decimal
  title_block: masthead
  contents: false
  summary_form: prose
  running_head: {header: [title, folio]}
  justify: none
  palette: {ink: "1A1A1A", ink_muted: "555555", line: "8C8C8C"}
  accent_on: []
  page_geometry: {columns: 2, column_gap_cm: 0.6}
  components:
    allowed: [callout]
  figure_style: {max_height_ratio: 0.40}
